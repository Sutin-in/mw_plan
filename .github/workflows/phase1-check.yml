# Phase 1 canonical check: the SAME `python tools/check.py` (9 gates) used locally.
#
# Credentials below are CI-only, throwaway values for an ephemeral PostgreSQL service
# container that exists only for the duration of the job. They are not production
# secrets. No real HOSxP connection or data is used anywhere in CI (mock only).
name: phase1-check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase1-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ppr_ci
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: ppr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppr_ci -d ppr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Stand-in for a HOSxP MySQL/MariaDB server: tests the SQL adapter against a
      # MADE-UP schema (tests/mockhx_schema.py). No HOSxP data or schema involved.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: mockhx_test
          MARIADB_USER: mockhx
          MARIADB_PASSWORD: ci_only_not_a_secret
          MARIADB_ROOT_PASSWORD: ci_only_root_not_a_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      PPR_DATABASE_URL: postgresql+psycopg://ppr_ci:ci_only_not_a_secret@localhost:5432/ppr_dev
      PPR_TEST_DATABASE_URL: postgresql+psycopg://ppr_ci:ci_only_not_a_secret@localhost:5432/ppr_test
      PPR_SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123456789
      PPR_TEST_HOSXP_MYSQL_URL: mysql+pymysql://mockhx:ci_only_not_a_secret@127.0.0.1:3306/mockhx_test
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Provision dev database (test database is created by the service)
        env:
          PGPASSWORD: ci_only_not_a_secret
        run: |
          psql -h localhost -U ppr_ci -d ppr_test -v ON_ERROR_STOP=1 -c "SELECT version();"
          psql -h localhost -U ppr_ci -d ppr_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE ppr_dev;"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Canonical check (9 gates)
        run: python tools/check.py
