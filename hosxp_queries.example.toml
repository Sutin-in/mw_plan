# ---------------------------------------------------------------- stock movements  (optional, D-39: report only)
# Issues from the central store to departments and returns from departments to the store,
# shown in the "Central Plan Usage" report. HOSxP stays their source of truth: they are read
# when the report runs, never stored here and never posted to the Plan Ledger.
# Written in its own [stock_movement] section (NOT under [queries]); it is used only with the
# verification record and the kind mapping below. Anything wrong in this section only makes
# the report say "ยังไม่มีข้อมูล" - it never stops the rest of this file from loading (a TOML
# syntax error or a misspelt section name still stops the file, as anywhere in it).
# parameters: :date_from, :date_to  (DATE, inclusive; the fiscal year so far)
# required columns: department_id, item_id, movement_date, movement_id, native_kind, qty
# optional columns: last_modified_at
#   * one row per movement of the CENTRAL store only; movement_id unique; rows only inside
#     the date range; movement_date a DATE.
#   * qty > 0 for issues AND returns: the direction comes from native_kind (if HOSxP records a
#     return as a negative issue, give it its own native_kind and a positive qty in the query).
#   * department_id = the department that received (issue) or gave back (return) the goods,
#     with the SAME id as get_departments returns (and item_id the same id as get_items).
#   * qty in the item's unit as in get_items / the PR lines (convert in the query if HOSxP's
#     store counts in another unit), so issues can be set against what PPRs bought.
#   * native_kind = HOSxP's own movement kind, mapped below. A movement of an unmapped kind
#     makes that item's and department's figures "ยังไม่มีข้อมูล" (never counted as zero).
#     With no RETURN kind mapped, returns and net use show "ยังไม่มีข้อมูล"
#     (IT confirms how HOSxP records a return).
# [stock_movement]
# sql = '''SELECT ... '''
# verified_by = "<name / position in IT>"
# verified_on = 2026-10-15
# reference = "<where the verification is recorded, e.g. a ticket or memo number>"
# [stock_movement.kind_map]
# "<native issue kind>" = "ISSUE"
# "<native return kind>" = "RETURN"

