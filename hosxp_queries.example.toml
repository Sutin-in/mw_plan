# HOSxP site query file - EXAMPLE / TEMPLATE
#
# Copy to  hosxp_queries.toml  (git-ignored) and write one read-only query per operation
# AFTER inspecting this hospital's HOSxP schema (python -m ppr.cli hosxp-schema).
# This template deliberately contains NO HOSxP table or column names: they are not
# guessed (spec §47). Each query must return columns named exactly as listed below
# (use "AS <name>"). Rules checked when the file is loaded:
#   * one statement, starting with SELECT or WITH; no INSERT/UPDATE/DELETE/SET/... words;
#   * named parameters exactly as listed (e.g. :pr_no);
#   * the database account must be READ-ONLY; queries also run in a READ ONLY transaction.
# Test with:  python -m ppr.cli hosxp-check --pr <PR number>
#
# Notes for the site author:
#   * fiscal_year = the PR budget year ("ปีงบประมาณ") as the B.E. year, e.g. 2568 (D-18).
#   * total_amount = the PR header total; amounts are VAT-inclusive estimates (D-17).
#   * pr_date must be a DATE (cast if HOSxP stores a datetime).
#   * native_status = the raw HOSxP PR status; map it below in [status_map].
#   * active must be true/false (or 1/0).
#   * Login (D-25): HOSxP stores an MD5 hash of the password. get_login_user returns the
#     stored hash as password_hash (hexadecimal); this system hashes what the user types
#     and compares. The hash is never stored, logged or shown by this system.
#     COALESCE(hash, '') so a user without a password is refused as "wrong password", not
#     as a configuration error. When the HOSxP user accounts are on another server, set
#     PPR_HOSXP_AUTH_DATABASE_URL: get_login_user / get_user_profile then run there (D-41),
#     and department_id may be left out (the PPR takes the PR's department).
#   * ids as TEXT: PostgreSQL  x::text  or  CAST(x AS TEXT)  - NOT "AS CHAR", which in
#     PostgreSQL is ONE character (it would cut '125' to '1');  MySQL/MariaDB  CAST(x AS CHAR).
#   * no invented defaults: never COALESCE a missing value into a made-up one (a year, a
#     date, 0, 1, 'Item'); a missing required value must stay missing so it is reported.

# [status_map]   # native HOSxP PR status -> one of: DRAFT, ACTIVE, APPROVED, CANCELLED, COMPLETED, UNKNOWN
# "<native value>" = "CANCELLED"

